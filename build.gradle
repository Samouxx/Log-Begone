plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'logbegone'
}

dependencies {
    // Minecraft 26.x is no longer obfuscated: no mappings line, the game already uses Mojang's names
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
}

processResources {
    def props = [version: project.version, minecraft_version: minecraft_version, loader_version: loader_version]
    inputs.properties props

    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_logbegone" }
    }
}
